<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
<title id="title">Fluxo simples de estudo</title><desc id="desc">Estudar conteúdo, escolher como organizar, revisar e seguir ou voltar ao tema.</desc>
<defs><style>.t{font:600 21px system-ui,sans-serif;fill:#173b48}.s{font:500 15px system-ui,sans-serif;fill:#49636a}.box{fill:#fff;stroke:#d8e5e2;stroke-width:2}.line{stroke:#86a9a2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1080" height="300" rx="24" fill="#f5f8f6"/>
<text x="54" y="58" class="t" style="font-size:25px">Um fluxo leve para estudar</text>
<rect x="54" y="104" width="210" height="112" rx="16" class="box"/><text x="159" y="151" text-anchor="middle" class="t">Estudar</text><text x="159" y="180" text-anchor="middle" class="s">conteúdo novo</text>
<path d="M270 160h55m-10-10 10 10-10 10" class="line"/>
<rect x="336" y="104" width="240" height="112" rx="16" fill="#e4f4ef" stroke="#9bd3c4" stroke-width="2"/><text x="456" y="151" text-anchor="middle" class="t">Organizar</text><text x="456" y="180" text-anchor="middle" class="s">texto, questão, mapa, lei…</text>
<path d="M582 160h55m-10-10 10 10-10 10" class="line"/>
<rect x="648" y="104" width="190" height="112" rx="16" class="box"/><text x="743" y="151" text-anchor="middle" class="t">Revisar</text><text x="743" y="180" text-anchor="middle" class="s">lembrar e praticar</text>
<path d="M844 160h55m-10-10 10 10-10 10" class="line"/>
<rect x="910" y="104" width="128" height="112" rx="16" fill="#fff0e9" stroke="#f0b39d" stroke-width="2"/><text x="974" y="151" text-anchor="middle" class="t">Avançar</text><text x="974" y="180" text-anchor="middle" class="s">ou retomar</text>
<text x="54" y="260" class="s">A nota muda conforme a matéria; o visual ajuda a encontrar o que importa.</text>
</svg>
